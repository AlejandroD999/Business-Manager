{% extends 'home_base.html' %}

{% block header %}
    <link rel="stylesheet" href="{{url_for('features.static', filename='expenses_style.css')}}"> 
{% endblock %}

{% block expenses_content  %}

<!-- Holds Charts and analysis of expenses -->
<div id="expenses_portfolio"></div>

<div class="expense_actions_div">

    <button class="create_expense_button" type="submit" onclick="button_clicked()">
        <img src="{{ url_for('features.static', filename='add_icon.png') }}" alt="create">
    </button>

    <form class="filter_form" method="POST">
        <input type="date" name="start_date" required>
        <input type="date" name="end_date" required>

        <input type="submit" value="Filter">
    </form>
</div>

<div class="create_expense_div">
    <form action="{{ url_for('features.create') }}" method="POST">
        <input type="text" name="description" placeholder="description">

        <input id="amount" type="number" name="amount" min="0.01" step="0.01" placeholder="Amount ($)">
        <input type="date" name="date" placeholder="date">
        
        <input type="submit" value="Create">
    </form>
</div>
<div id="expenses_container">

    <table class="expenses_table">

        <tr>
            {% for table_header in table_headers %}
                <th>{{ table_header }}</th>
            {% endfor %}
        </tr>
        
        {% for expense in expenses %}

            <tr class="expense_row">
                <td contenteditable="true" spellcheck="false">{{ expense.description }}</td>
                <td contenteditable="true" spellcheck="false">{{ expense.amount }}</td>
                <td contenteditable="true" spellcheck="false">{{ expense.date}}</td>
                <td>
                    <button class="expense_delete_button" onclick="handle_expense_delete_button()">
                        <img src="{{ url_for('features.static', filename='delete_icon.png') }}" alt="Delete">
                    </button>
                </td>
            </tr>

        {% endfor %}

    </table>
</div>

<script>
    function button_clicked() {
        alert("Button Clicked");
    };
</script>

{% endblock %}
