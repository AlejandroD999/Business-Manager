{% extends 'home_base.html' %}

{% block header %}
    <link rel="stylesheet" href="{{url_for('features.static', filename='expenses_style.css')}}"> 
{% endblock %}

{% block expenses_content  %}

<!-- Holds Charts and analysis of expenses -->
<div id="expenses_portfolio"></div>

<div id="expense_history_container">
    
    <form action="/filter-expenses" method="POST">

        <select id="months_options" name="month">
            <option value="" disabled selected hidden>Month</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
        </select>

        <select id="year_options" name="year">
            <option value="" disabled selected hidden>Year</option>
            {% for y in years %}
                <option value={{ y }}>{{ y }}</option>
            {% endfor %}
        </select>

        <input type="submit" value="Apply">
    </form>

    <table class="expenses_table">

        <tr>
            {% for table_header in table_headers %}
                <th>{{ table_header }}</th>
            {% endfor %}
        </tr>
        
        {% for expense in expenses %}

            <tr class="expense_row">
                <td contenteditable="true">{{ expense.description }}</td>
                <td contenteditable="true">{{ expense.amount }}</td>
                <td contenteditable="true">{{ expense.date}}</td>
            </tr>

        {% endfor %}

    </table>
</div>

{% endblock %}
