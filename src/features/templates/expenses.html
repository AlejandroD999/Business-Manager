{% extends 'home_base.html' %}

{% block header %}
    <link rel="stylesheet" href="{{url_for('features.static', filename='expenses_style.css')}}"> 
{% endblock %}

{% block extra_body %}
<table id="expenses_table">
    <tr>
        {% for table_header in table_headers %}
            <th>{{ table_header }}</th>
        {% endfor %}
    </tr>
    
    {% for expense in expenses %}
        <tr>
            <td>{{ expense.description }}</td>
            <td>{{ expense.amount }}</td>
            <td>{{ expense.date}}</td>
        </tr>
    {% endfor %}

</table>

{% endblock %}
