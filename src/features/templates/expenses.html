{% extends 'home_base.html' %}

{% block header %}
    <link rel="stylesheet" href="{{url_for('features.static', filename='expenses_style.css')}}"> 
{% endblock %}

{% block expenses_content  %}

<!-- Holds Charts and analysis of expenses -->
<div id="expenses_portfolio"></div>

<div id="expense_history_container">
    
    <form method="POST">

        <select id="months_options" name="month">
            <option value="" disabled selected hidden>Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>

        <select id="year_options" name="year" required>
            <option value="" disabled selected hidden>Year</option>
            {% for y in years %}
                <option value={{ y }}>{{ y }}</option>
            {% endfor %}
        </select>

        <input type="submit" value="Apply">
    </form>

    <table class="expenses_table">

        <tr>
            {% for table_header in table_headers %}
                <th>{{ table_header }}</th>
            {% endfor %}
        </tr>
        
        {% for expense in expenses %}

            <tr class="expense_row">
                <td contenteditable="true">{{ expense.description }}</td>
                <td contenteditable="true">{{ expense.amount }}</td>
                <td contenteditable="true">{{ expense.date}}</td>
            </tr>

        {% endfor %}

    </table>
</div>

{% endblock %}
